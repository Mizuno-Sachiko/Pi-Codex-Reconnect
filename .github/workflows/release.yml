name: Check and publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Package and verify release
        id: package
        shell: bash
        run: |
          npm pack --ignore-scripts --json > pack.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync('pack.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${pack.version}`) {
            throw new Error('Version tag does not match package.json');
          }
          const response = await fetch(`https://registry.npmjs.org/${pack.name}/${pack.version}`);
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`npm registry returned ${response.status}`);
            // The first release is published manually before npm can authorize a trusted publisher.
            if ((await response.json()).dist.integrity !== pack.integrity) {
              throw new Error('Published version differs from this release; use a new version');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${response.status === 404}\nfile=${pack.filename}\n`);
          NODE
      - name: Publish to npm
        if: steps.package.outputs.publish == 'true'
        run: npm publish "${{ steps.package.outputs.file }}" --ignore-scripts
